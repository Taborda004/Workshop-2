version: '3.8'

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-workshop-airflow:3.1.8}
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - PYTHONPATH=/opt/airflow
    - MYSQL_HOST=mysql
    - MYSQL_PORT=3306
    - MYSQL_USER=${MYSQL_USER:-root}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-1234}
    - GRAMMY_SOURCE_DB=${GRAMMY_SOURCE_DB:-grammy_source}
    - DW_DATABASE=${DW_DATABASE:-spotify_grammy_dw}
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin,airflow:admin
    - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE=/opt/airflow/config/simple_auth_manager_passwords.json
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-webserver:8080/execution
    - AIRFLOW__API_AUTH__JWT_SECRET=workshop2sharedjwtsecretkeyforairflow3000==
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFfDewikoUp2Q_Deps=
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./gx:/opt/airflow/gx
    - ./data:/opt/airflow/data
    - ./docs/evidence:/opt/airflow/docs/evidence
    - ./sql:/opt/airflow/sql
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres_airflow:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  postgres_airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    restart: always

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    ports:
      - "3307:3306"
    volumes:
      - mysql_dw_data:/var/lib/mysql
      - ./sql/source_setup.sql:/docker-entrypoint-initdb.d/01_source_setup.sql:ro
      - ./sql/dw_schema.sql:/docker-entrypoint-initdb.d/02_dw_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: airflow db migrate
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow api-server -H 0.0.0.0 -p 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: always

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    restart: always

volumes:
  mysql_dw_data:
