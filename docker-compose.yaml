version: '3.8'

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.8}
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
    - PYTHONPATH=/opt/airflow
    - MYSQL_HOST=${MYSQL_HOST:-mysql}
    - MYSQL_PORT=${MYSQL_PORT:-3306}
    - MYSQL_USER=${MYSQL_USER:-root}
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-1234}
    - GRAMMY_SOURCE_DB=${GRAMMY_SOURCE_DB:-grammy_source}
    - DW_DATABASE=${DW_DATABASE:-spotify_grammy_dw}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./gx:/opt/airflow/gx
    - ./data:/opt/airflow/data
    - ./docs/evidence:/opt/airflow/docs/evidence
    - ./sql:/opt/airflow/sql
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres_airflow:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  postgres_airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    restart: always

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    ports:
      - "3307:3306"
    volumes:
      - mysql_dw_data:/var/lib/mysql
      - ./sql/source_setup.sql:/docker-entrypoint-initdb.d/01_source_setup.sql:ro
      - ./sql/dw_schema.sql:/docker-entrypoint-initdb.d/02_dw_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "pip install -r /opt/airflow/requirements.txt --no-warn-script-location &&
      airflow db migrate &&
      airflow users create --role Admin --username ${_AIRFLOW_WWW_USER_USERNAME:-airflow} --password ${_AIRFLOW_WWW_USER_PASSWORD:-airflow} --firstname Admin --lastname User --email admin@example.com || true"
    volumes:
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./data:/opt/airflow/data
      - ./docs/evidence:/opt/airflow/docs/evidence
      - ./sql:/opt/airflow/sql
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: >
      bash -c "pip install -r /opt/airflow/requirements.txt --no-warn-script-location && airflow webserver"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: always
    volumes:
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./data:/opt/airflow/data
      - ./docs/evidence:/opt/airflow/docs/evidence
      - ./sql:/opt/airflow/sql

  airflow-scheduler:
    <<: *airflow-common
    command: >
      bash -c "pip install -r /opt/airflow/requirements.txt --no-warn-script-location && airflow scheduler"
    restart: always
    volumes:
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./gx:/opt/airflow/gx
      - ./data:/opt/airflow/data
      - ./docs/evidence:/opt/airflow/docs/evidence
      - ./sql:/opt/airflow/sql

volumes:
  mysql_dw_data:
